<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOCI2004 MCQ Practice</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#e3e1da;--accent:#2f6f5e;--accent-t:#fff;--ok:#1f7a4d;--okbg:#e4f4ea;--bad:#b42318;--badbg:#fdeaea;--sel:#eef4f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--card:#1e2225;--text:#e8eaec;--muted:#9aa3ab;--line:#31373b;--accent:#5fb89f;--accent-t:#0e1a16;--ok:#6fd49b;--okbg:#17302337;--bad:#ff8a80;--badbg:#3a1c1b;--sel:#232b2a}}
:root[data-theme="dark"]{--bg:#15181a;--card:#1e2225;--text:#e8eaec;--muted:#9aa3ab;--line:#31373b;--accent:#5fb89f;--accent-t:#0e1a16;--ok:#6fd49b;--okbg:#173023;--bad:#ff8a80;--badbg:#3a1c1b;--sel:#232b2a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-t);border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:16px}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;gap:8px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.tag{font-size:12px;color:var(--muted)}
.q{font-size:18px;font-weight:600;margin:6px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;font-size:15px;line-height:1.4}
.opt:hover:not(:disabled){background:var(--sel)}
.opt .l{font-weight:700;min-width:20px;color:var(--muted)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--text)}
.exp{border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--sel);border-left:4px solid var(--accent);font-size:15px}
.exp b.v{display:block;margin-bottom:4px}.exp.ok b.v{color:var(--ok)}.exp.bad b.v{color:var(--bad)}
.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
.big{font-size:44px;font-weight:700;margin:6px 0}
.miss{border-top:1px solid var(--line);padding:10px 0;font-size:14px}.miss b{display:block;margin-bottom:2px}
.hide{display:none}.small{font-size:13px;color:var(--muted)}
</style></head><body><div class="wrap">
<h1>SOCI2004 MCQ Practice</h1>
<p class="sub">159 questions from your question bank. Answer, then see the explanation straight away.</p>

<div id="setup" class="card">
  <label class="f">Sections</label>
  <div class="chips" id="secs"></div>
  <label class="f">Question order</label>
  <div class="chips" id="order"></div>
  <label class="f">How many questions</label>
  <div class="chips" id="count"></div>
  <div class="small" id="avail" style="margin-top:10px"></div>
  <button class="pri" id="start">Start practice</button>
  <button class="sec" id="startMissed" style="width:100%;margin-top:10px">Practise my saved missed questions</button>
  <div class="small" style="margin-top:10px" id="savedinfo"></div>
</div>

<div id="quiz" class="hide">
  <div class="top"><span id="prog"></span><span id="score"></span></div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="card">
    <div class="tag" id="qtag"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div id="exp"></div>
    <div class="row"><button class="sec" id="quit">End session</button><button class="pri" id="next" style="margin-top:0" disabled>Next</button></div>
  </div>
</div>

<div id="done" class="hide card">
  <div class="small">Session complete</div>
  <div class="big" id="final"></div>
  <div id="finalsub" class="small"></div>
  <div id="missed" style="margin-top:12px"></div>
  <div class="row"><button class="sec" id="again">Back to setup</button><button class="pri" id="retry" style="margin-top:0">Retry missed</button></div>
</div>
</div>
<script>
const Q=[{"id": 1, "section": "Population Census", "q": "Which statement best defines a population census?", "opts": ["A complete count of the population of a country at a given point in time, with data collected, compiled and published for all persons", "A register of residents kept up to date by local authorities", "The continuous recording of births and deaths as they occur", "A survey of a representative 10% sample of households"], "ans": 0, "exp": "A census is a complete count at a specific time. It is also the sampling frame for later surveys."}, {"id": 2, "section": "Population Census", "q": "Which of these is NOT a source of demographic data listed in the lecture?", "opts": ["Sample surveys", "Migration control systems", "Vital registration systems", "Opinion polls run by media houses"], "ans": 3, "exp": "The six sources are census, vital registration, migration control systems, sample surveys, administrative sources and population registers."}, {"id": 3, "section": "Population Census", "q": "Which of these is NOT an essential characteristic of a census?", "opts": ["Simultaneity", "Defined periodicity", "Voluntary participation", "Individual enumeration"], "ans": 2, "exp": "Participation in the census is compulsory. The six characteristics are individual enumeration, universality, simultaneity, periodicity, legal basis and small area estimation."}, {"id": 4, "section": "Population Census", "q": "Simultaneity in census taking means:", "opts": ["Males and females are counted in the same table", "Everyone is counted as at the same reference time, using a designated census day", "The census and housing count use the same form", "Several enumerators visit each household at once"], "ans": 1, "exp": "The census moment is 12 am on census day, and census night runs 12 am to 6 am."}, {"id": 5, "section": "Population Census", "q": "The UN recommends that censuses be taken every:", "opts": ["Every year using sampling", "10 years, preferably in years ending in 0", "20 years, in years ending in 0", "5 years, in years ending in 5"], "ans": 1, "exp": "Ten-year intervals keep data comparable within and between countries."}, {"id": 6, "section": "Population Census", "q": "Which country takes its census every five years rather than every ten?", "opts": ["Australia", "Jamaica", "United Kingdom", "United States"], "ans": 0, "exp": "Japan, Australia, Ireland, New Zealand and Canada use 5-year intervals. The USA and UK use 10 years."}, {"id": 7, "section": "Population Census", "q": "The first official census in the British West Indies was taken in:", "opts": ["1982", "1946", "1801", "1844"], "ans": 3, "exp": "1844 was the first official census (and the first modern census in Jamaica). The first modern West Indian Census was 1946, and the UK began in 1801."}, {"id": 8, "section": "Population Census", "q": "Jamaica****'****s 2022 census was the country****'****s:", "opts": ["10th census", "12th census", "15th census", "8th census"], "ans": 2, "exp": "1943 was the 8th census. 2022 is counted as the 15th."}, {"id": 9, "section": "Population Census", "q": "Which counting method does Jamaica use?", "opts": ["A sample-based count only", "De facto, counting people where they spent census night", "De jure, counting people at their usual place of residence", "A population register count"], "ans": 2, "exp": "Jamaica uses the de jure method."}, {"id": 10, "section": "Population Census", "q": "In a de facto census, people are enumerated:", "opts": ["At the address on their registration card", "Where they spent census night, regardless of usual residence, and visitors are included", "At their usual residence, with visitors left out", "At their place of birth"], "ans": 1, "exp": "De facto counts presence on census night. Usual residents abroad are not included."}, {"id": 11, "section": "Population Census", "q": "A main weakness of the de facto method is that:", "opts": ["It makes good migration data hard to establish and may undercount the usual population", "It double counts people with two homes", "It requires a population register", "It excludes visitors"], "ans": 0, "exp": "Because people are not counted by usual residence, migration data suffer."}, {"id": 12, "section": "Population Census", "q": "Which territory used a de facto count in 2000/2010?", "opts": ["Jamaica", "Barbados", "Bahamas", "Grenada"], "ans": 3, "exp": "Grenada, Dominica, Guyana, St Kitts, St Lucia, Antigua and T&T were de facto. Jamaica, Bahamas and Barbados were de jure."}, {"id": 13, "section": "Population Census", "q": "The Caribbean problem with the de jure method is that:", "opts": ["Enumerators cannot find ED boundaries", "Visitors are counted twice", "Hotels cannot be enumerated", "People may have more than one usual place of residence, causing double counting"], "ans": 3, "exp": "Multiple usual residences lead to double counting."}, {"id": 14, "section": "Population Census", "q": "Who would be INCLUDED in Jamaica****'****s de jure count?", "opts": ["A foreign diplomat stationed in Jamaica", "A Jamaican diplomat who has been abroad for 2 years", "A Jamaican temporarily abroad for 3 months", "A tourist visiting for two weeks"], "ans": 2, "exp": "Persons away under six months are included. Those away six months or more, visitors and foreign diplomats are excluded."}, {"id": 15, "section": "Population Census", "q": "A household helper is counted as a member of the household if she:", "opts": ["Has a separate kitchen but sleeps on the premises", "Lives in, sleeps there at least 4 nights a week and shares at least a meal with the family", "Works there at least 3 days a week", "Is paid by the household head"], "ans": 1, "exp": "A helper who cooks separately is a separate household."}, {"id": 16, "section": "Population Census", "q": "A dwelling unit is established on the basis of:", "opts": ["Separateness (walls or partitions) and independence (private access)", "Number of occupants and rooms", "Type of roofing and outer walls", "Ownership and rent"], "ans": 0, "exp": "Separateness and independence define a dwelling unit."}, {"id": 17, "section": "Population Census", "q": "How many households does a typical Jamaican enumeration district hold?", "opts": ["100 to 150", "20 to 40", "1,000 or more", "300 to 400"], "ans": 0, "exp": "EDs are sized to be a reasonable workload for one enumerator."}, {"id": 18, "section": "Population Census", "q": "How many EDs were there in Jamaica for the 2011 census?", "opts": ["5,235", "6,950", "4,118", "5,776"], "ans": 3, "exp": "5,235 was the 2001 figure."}, {"id": 19, "section": "Population Census", "q": "On an ED boundary description, the end of each segment is signalled by:", "opts": ["A dash, with an arrow at the end", "A comma, with a colon at the end", "A semicolon, with a full stop at the starting point ending the whole description", "A full stop, with a semicolon at the end"], "ans": 2, "exp": "Each segment begins on a new line and ends with a semicolon. The description ends at the start point with a full stop."}, {"id": 20, "section": "Population Census", "q": "A map scale (representative fraction) of 1:10,000 means:", "opts": ["The ED covers 10,000 households", "One unit on the map represents 10,000 of the same unit on the ground", "One inch on the map is 10 miles", "One centimetre on the map is 10 kilometres"], "ans": 1, "exp": "A representative fraction is unit-free. (Your slide text says 10 miles, which is a slide error.)"}, {"id": 21, "section": "Population Census", "q": "In the 2001 Jamaican census the long form was given to:", "opts": ["90% of households with 27 questions", "10% of households and contained the 27 short-form questions plus 44 more", "All households with 44 questions", "50% of households with 71 questions"], "ans": 1, "exp": "The short form went to 90% of households with 27 questions."}, {"id": 22, "section": "Population Census", "q": "Which provision protects the confidentiality of census information in Jamaica?", "opts": ["Section 17(2) of the Statistics (Amendment) Act 1984", "Section 5 of the Census Act 1844", "The Data Protection Act 2020", "The Registration of Births and Deaths Act"], "ans": 0, "exp": "It forbids publishing information in any form that would identify individuals."}, {"id": 23, "section": "Population Census", "q": "Which is an advantage of self-enumeration over the canvasser method?", "opts": ["Interviewers take more responsibility for accuracy", "It is the more widely used method worldwide", "Response rates are always higher", "Respondents have time to consult records, and it is cheaper with less need for highly trained enumerators"], "ans": 3, "exp": "Canvassing is the more widely used method. Self-enumeration is common in Australia and New Zealand."}, {"id": 24, "section": "Population Census", "q": "In the canvass method:", "opts": ["No enumerators are needed", "The household head fills in the form alone", "The interviewer carries greater responsibility for the accuracy of the data", "Forms are distributed by mail only"], "ans": 2, "exp": "Canvassing is the more widely used method."}, {"id": 25, "section": "Population Census", "q": "Omitting remote areas and homeless people from the count is an example of a:", "opts": ["Sampling error", "Content error", "Coverage error", "Processing error"], "ans": 2, "exp": "Coverage errors arise from omitted areas or groups and outdated geographical frames."}, {"id": 26, "section": "Population Census", "q": "Which census data are most prone to content error?", "opts": ["Type of roofing", "Age and income", "Sex and marital status", "Number of rooms"], "ans": 1, "exp": "Content errors are incorrect answers, accidental or deliberate. They are worse in age and income data."}, {"id": 27, "section": "Population Census", "q": "A post-enumeration survey (PES) typically covers about:", "opts": ["5 to 10% of the population, to test the accuracy of the census", "50% of the population, to replace the census", "All households that refused", "1% of the population, to count visitors"], "ans": 0, "exp": "A PES is a sample survey after the census, using the best enumerators and supervisors."}, {"id": 28, "section": "Population Census", "q": "Population at the start: 2,000,000. Births 400,000, deaths 150,000, immigrants 30,000, emigrants 180,000. The census counted 2,080,000. The error of closure is:", "opts": ["+20,000, an overcount", "+80,000, an overcount", "-80,000, an undercount", "-20,000, an undercount"], "ans": 3, "exp": "Expected = 2,000,000 + 400,000 - 150,000 + 30,000 - 180,000 = 2,100,000. Error = 2,080,000 - 2,100,000 = -20,000. Negative means undercount."}, {"id": 29, "section": "Population Census", "q": "Civil registration is best described as:", "opts": ["A sample survey of births and deaths", "The periodic counting of all residents", "The analysis and publication of vital data", "The continuous, permanent, compulsory and universal recording of vital events"], "ans": 3, "exp": "Vital statistics is the process of collecting, compiling, analysing and disseminating the data."}, {"id": 30, "section": "Population Census", "q": "Under Jamaica****'****s Registration of Births and Deaths Act, births and deaths must be registered within:", "opts": ["1 year for both", "5 days for a birth and 42 days for a death", "42 days for a birth and 5 days for a death", "3 months for both"], "ans": 2, "exp": "Live or still births: 42 days. Deaths: 5 days."}, {"id": 31, "section": "Population Census", "q": "The UN calls registration of a vital event one year or more after it occurred:", "opts": ["Retrospective registration", "Delayed registration", "Late registration", "Coroner registration"], "ans": 1, "exp": "UN late = over 3 months but under 1 year. Jamaica uses the word delayed for what the UN calls late."}, {"id": 32, "section": "Population Census", "q": "The Apgar score is assessed on how many signs, and what is the maximum score?", "opts": ["5 signs, maximum 10", "10 signs, maximum 5", "5 signs, maximum 100", "3 signs, maximum 6"], "ans": 0, "exp": "Activity, pulse, grimace, appearance, respiration, each 0 to 2, at 1 and 5 minutes. 7 to 10 is generally normal."}, {"id": 33, "section": "Population Census", "q": "Which countries were named as relying on population registers rather than a traditional census?", "opts": ["Netherlands, Spain and Austria", "Jamaica, Haiti and Cuba", "USA, UK and Ireland", "Japan, Canada and Australia"], "ans": 0, "exp": "Alternatives include administrative censuses, which struggle with linking databases, coverage and delays."}, {"id": 34, "section": "Population Census", "q": "What did the 1990 US census controversy highlight, leading to the 1998 dispute over sampling?", "opts": ["Respondents refused to answer the race question", "The census was taken on the wrong day", "Enumerators were not trained", "Over 10 million people were missed and 6 million counted twice or in the wrong place"], "ans": 3, "exp": "Opponents of sampling argued the Constitution requires an actual enumeration."}, {"id": 35, "section": "Population Census", "q": "Jamaica****'****s 2022 census results (released October 2025) showed a population of 2,774,538 and an average annual growth rate of:", "opts": ["-0.5%, a decline", "1.2%, the highest since 1970", "0.24%, the lowest from 1970 to 2022", "2.8%, the same as 2011"], "ans": 2, "exp": "The population rose 2.8% in total over 2011 to 2022 (about 0.24% a year). St Catherine had the biggest gain, +26,545."}, {"id": 36, "section": "Population Census", "q": "According to the lecture, how often did Rome take a census of its empire?", "opts": ["Only once, under Augustus", "Every five years", "Every ten years", "Every year"], "ans": 1, "exp": "The slide states Rome took a census of its empire every five years (from as early as 5 BC)."}, {"id": 37, "section": "Population Census", "q": "The first national census of Israel in Numbers 1 counted:", "opts": ["Only the tribe of Levi", "Men aged 20 and over able to go to war, excluding the Levites", "All heads of household regardless of age", "All men, women and children"], "ans": 1, "exp": "About 603,550 men were counted, not including women, children or Levites. It was carried out by Moses and Aaron."}, {"id": 38, "section": "Population Census", "q": "King David****'****s census (2 Samuel 24) was controversial because it was seen as:", "opts": ["Relying on military strength rather than on God", "Done only for taxation", "Carried out by foreigners", "Counting women and children"], "ans": 0, "exp": "Joab carried it out reluctantly. The results were about 800,000 men in Israel and 500,000 in Judah."}, {"id": 39, "section": "Population Census", "q": "The Census Bill became law in Great Britain in:", "opts": ["1900, with the first census in 1901", "1844, with the first census in 1851", "1750, with the first census in 1760", "1800, with the first census in 1801"], "ans": 3, "exp": "The UK has counted every 10 years since 1801."}, {"id": 40, "section": "Population Census", "q": "Age was first added to the UK census questionnaire in:", "opts": ["1871", "1841", "1821", "1801"], "ans": 2, "exp": "1811 stressed main occupation, 1821 added age, 1831 detailed occupation, and 1841 had the Registrar General collect data from household heads."}, {"id": 41, "section": "Population Census", "q": "The West Indian Federation was established in:", "opts": ["1962", "1946", "1958", "1844"], "ans": 2, "exp": "In 1959 a regional committee coordinated census activities, while individual countries collected their own data."}, {"id": 42, "section": "Population Census", "q": "In Israel****'****s 1948 census the home curfew on census day was used to:", "opts": ["Collect fingerprints", "Make sure everyone was home during the visit and reduce the risk of double counting", "Allow visitors to be counted", "Stop people migrating"], "ans": 1, "exp": "The curfew lasted 7 hours on 8 November 1948. Enumerators checked earlier records and issued vouchers for identity cards."}, {"id": 43, "section": "Population Census", "q": "Individual enumeration means:", "opts": ["Each person and each set of living quarters is enumerated separately, so characteristics can be cross-classified", "Only one person per household is counted", "Data are collected only from individuals who volunteer", "Only household heads are interviewed"], "ans": 0, "exp": "Data for each household member go on a separate sheet. A household head or responsible adult can answer for absent or dependent persons."}, {"id": 44, "section": "Population Census", "q": "Universality requires that the census:", "opts": ["Count only usual residents", "Cover only the capital city", "Be repeated every year", "Count all eligible persons within a precisely defined territory"], "ans": 3, "exp": "Sampling can still be used for specific characteristics if the design fits the size of the areas tabulated."}, {"id": 45, "section": "Population Census", "q": "Census night, as defined in the lecture, is:", "opts": ["Midday to midnight", "12 am to 11:59 pm", "6 pm to 12 am the day before", "12 am to 6 am on census day"], "ans": 3, "exp": "Census day is 12 am to 11:59 pm. The census moment is 12 am."}, {"id": 46, "section": "Population Census", "q": "Which item appears on the 2011 Jamaican HOUSEHOLD questionnaire rather than the individual questionnaire?", "opts": ["Ethnic origin", "Educational attainment", "Source of drinking water", "Religious affiliation"], "ans": 2, "exp": "The household form covers housing: type of unit, walls, roofing, rooms, tenure, water, fuel, lighting, waste disposal. The individual form covers age, sex, religion, education and so on."}, {"id": 47, "section": "Population Census", "q": "Which item appears on the 2011 Jamaican INDIVIDUAL questionnaire?", "opts": ["Number of rooms", "Religious affiliation", "Type of fuel used for cooking", "Type of roofing"], "ans": 1, "exp": "Individual items include age, sex, relationship to head, religion, ethnic origin, union status, education, limitations, birthplace, training, economic activity, fertility, transport and ICT."}, {"id": 48, "section": "Population Census", "q": "Which was reported as a challenge in collecting census data in Jamaica?", "opts": ["The belief that the information would be given to tax collectors", "Overly detailed maps", "Respondents demanding payment", "Too many enumerators volunteering"], "ans": 0, "exp": "Others: hostility to a government project, no visible personal benefit, violence, dog bites, gated communities and unproductive workers."}, {"id": 49, "section": "Population Census", "q": "A convent or a children****'****s home is classified as a:", "opts": ["Group dwelling", "Housing unit only", "Floating population", "Private dwelling"], "ans": 0, "exp": "Group dwellings include dormitories, children's homes, convents and military barracks."}, {"id": 50, "section": "Population Census", "q": "Why must each person be associated with one ED on census night?", "opts": ["To measure the size of the ED", "To assign them a tax number", "To calculate migration", "To avoid omission or double counting of the population"], "ans": 3, "exp": "Each ED is also sized to be a reasonable workload for one enumerator."}, {"id": 51, "section": "Population Census", "q": "What happens to EDs that are too large?", "opts": ["They are counted by sampling only", "They are excluded", "They are divided into blocked EDs", "They are merged with neighbours"], "ans": 2, "exp": "Boundaries must not cross each other or administrative areas, and should follow permanent features."}, {"id": 52, "section": "Population Census", "q": "Which is a limitation of mailed self-enumeration forms?", "opts": ["They require highly trained enumerators", "A lower response rate than interviewer-administered forms, and a child might complete the form", "They cannot be used for a de facto count", "They cost more than interviews"], "ans": 1, "exp": "Advantages include lower cost, time to consult records and easier simultaneity."}, {"id": 53, "section": "Population Census", "q": "Which measure reduces content error in census data?", "opts": ["Counting only at night", "Using highly motivated and well-paid enumerators", "Reducing the number of questions to one", "Using outdated maps"], "ans": 1, "exp": "Content error is also less likely in populations with very high literacy."}, {"id": 54, "section": "Population Census", "q": "A positive error of closure indicates that the census count:", "opts": ["Is higher than expected, an overcount", "Has no migration error", "Equals the PES count", "Is lower than expected, an undercount"], "ans": 0, "exp": "Error of closure = census population minus the population expected from the balancing equation. A smaller error is better."}, {"id": 55, "section": "Population Census", "q": "Which of these is NOT counted as a vital event?", "opts": ["Fetal death", "Annulment", "Adoption", "Internal migration of a household"], "ans": 3, "exp": "Vital events: births, deaths, fetal deaths, marriages, divorce, adoption, legitimation, recognition of parenthood, annulment, judicial separation."}, {"id": 56, "section": "Population Census", "q": "Vital registration began in Europe as:", "opts": ["A function of the police", "A function of census bureaus", "An ecclesiastical function recording burials, baptisms and weddings", "A tax of the Roman army"], "ans": 2, "exp": "Today it covers births, deaths, marriages, divorce, adoption and more."}, {"id": 57, "section": "Population Census", "q": "Which vital events are hardest to capture in registration?", "opts": ["Marriages in churches", "Deaths in hospitals", "Births outside hospitals and those not attended by a professional health provider", "Hospital births"], "ans": 2, "exp": "This contributes to under-counting of foetal, neonatal and maternal deaths. Registration is better developed in MDCs than LDCs."}, {"id": 58, "section": "Population Census", "q": "Under the Statistics Act of Jamaica, Section 19(b), a person who wilfully gives the registrar false information is liable to:", "opts": ["A fine not exceeding $25,000 only", "A fine not exceeding $250,000 or imprisonment not exceeding three months", "A warning and re-enumeration", "Imprisonment of up to five years"], "ans": 1, "exp": "Shown on the Statistics Act slide. It stresses the importance of accurate information."}, {"id": 59, "section": "Population Census", "q": "The Statistics Act slides list which of these as an offence?", "opts": ["Refusing or neglecting to answer a question put under the Act, or knowingly giving an untrue answer", "Moving house within a month of census night", "Leaving a census form blank on the first visit", "Asking an enumerator for identification"], "ans": 0, "exp": "Hindering an authorised person, destroying or defacing forms, and abandoning an enumerator appointment without good cause are also offences."}, {"id": 60, "section": "Population Census", "q": "Which Jamaican census interval had positive net migration (more people entering than leaving)?", "opts": ["1960 to 1970", "1943 to 1960", "2001 to 2011", "1921 to 1943 (+25,800)"], "ans": 3, "exp": "All other intercensal periods in Table (ii) show net emigration, for example -195,200 (1943-60) and -296,500 (1960-70)."}, {"id": 61, "section": "Population Census", "q": "In the Jamaica table of components of growth 1911 to 2011, which intercensal period had the largest net emigration?", "opts": ["1982 to 1991 (-181,601)", "2001 to 2011 (-168,714)", "1921 to 1943 (-77,100)", "1960 to 1970 (-296,500)"], "ans": 3, "exp": "The 1960s saw heavy emigration to the UK and North America."}, {"id": 62, "section": "Population Census", "q": "Jamaica****'****s population in the 2001 and 2011 censuses was:", "opts": ["2,380,666 and 2,607,632", "2,697,983 and 2,774,538", "2,607,632 and 2,697,983", "2,190,357 and 2,380,666"], "ans": 2, "exp": "1982: 2,190,357. 1991: 2,380,666. 2022: 2,774,538."}, {"id": 63, "section": "Population Census", "q": "Jamaica****'****s average annual growth rate between the 2001 and 2011 censuses was about:", "opts": ["0.87%", "0.36%", "1.40%", "1.67%"], "ans": 1, "exp": "Earlier: 0.87% (1991-2001), 0.95% (1982-91), 1.40% (1970-82), 1.67% (1921-43). The 2022 census put 2011-2022 at 0.24%."}, {"id": 64, "section": "Population Census", "q": "Which parish had the largest population in the 2011 census?", "opts": ["St Andrew (573,369, 21.25%)", "Clarendon (245,103)", "St Catherine (516,218)", "Kingston (89,057)"], "ans": 0, "exp": "St Catherine was second at 19.13%. In 2022 St Catherine and Kingston and St Andrew remain the biggest."}, {"id": 65, "section": "Population Census", "q": "The Caribbean census round of 2020 was disrupted by COVID-19. Jamaica****'****s census, originally planned for 2021, was moved to:", "opts": ["2022", "2023", "2020", "2024"], "ans": 0, "exp": "Fieldwork ran from September 2022. The revised plan showed no census in 2020, 12 countries in 2021 and 6 in 2022 (including Jamaica, T&T and St Vincent)."}, {"id": 66, "section": "Population Census", "q": "The 2020 census round plan before COVID expected which country group to take censuses in 2022?", "opts": ["Jamaica, Dominica and Grenada", "The Bahamas, Barbados and Belize", "Trinidad and Tobago, Cayman and St Lucia", "Suriname, Guyana and Turks and Caicos Islands"], "ans": 3, "exp": "The original plan: 6 countries in 2020, 9 in 2021 (including Jamaica), 3 in 2022."}, {"id": 67, "section": "Population Census", "q": "In the US Household Pulse Survey slide, the ****'****SOGI****'**** questions refer to:", "opts": ["Sex of group interviews", "Statistics on gender inequality", "Sexual orientation and gender identity, asked in addition to sex", "Sampling of group individuals"], "ans": 2, "exp": "Phase 3.2 asks sex assigned at birth, current gender identity and sexual orientation."}, {"id": 68, "section": "Population Census", "q": "Which abbreviation is used on the 1:50,000 metric series map key for ****'****Health Centre****'****?", "opts": ["HCt", "HC", "Hlth", "HeC"], "ans": 1, "exp": "Others on the key: Hosp (hospital), Mkt (market), Cem (cemetery), ComC (community centre), Lib (library), F (fording), Fcty (factory)."}, {"id": 69, "section": "Population Census", "q": "On the Jamaica map symbol key, which feature is drawn as a solid red heavy line?", "opts": ["Railway line", "A1 main road", "Parish boundary", "River"], "ans": 1, "exp": "Parish and county boundaries use dashed lines. Rivers and canals are blue."}, {"id": 70, "section": "Population Census", "q": "The Trinidad and Tobago exercise: population at the start of 1946-1960 was 558,000, with births 365,400, deaths 104,200 and net migration +13,400. The calculated population at the end of the period is:", "opts": ["832,600", "822,000", "828,000", "926,800"], "ans": 0, "exp": "558,000 + 365,400 - 104,200 + 13,400 = 832,600."}, {"id": 71, "section": "Population Census", "q": "Using the same T****&****T data, the census population at the end of 1960 was 828,000. The error of closure is:", "opts": ["-74,700, an undercount", "+4,600, an overcount", "0", "-4,600, an undercount"], "ans": 3, "exp": "828,000 - 832,600 = -4,600. Negative means the census undercounted."}, {"id": 72, "section": "Population Census", "q": "T****&****T 1960-1970: start 828,000, births 307,400, deaths 68,200, net migration -51,800. The census count at the end was 940,700. The error of closure is:", "opts": ["+74,700", "-4,600", "-74,700", "+25,400"], "ans": 2, "exp": "Expected = 828,000 + 307,400 - 68,200 - 51,800 = 1,015,400. 940,700 - 1,015,400 = -74,700."}, {"id": 73, "section": "Population Census", "q": "In the exercise ****'****births 11,000 and deaths 7,200 over 1993-1995; population 263,100 at the end of 1992 and 264,400 at the end of 1995****'****, net migration is:", "opts": ["+2,500", "-1,300", "-2,500", "+3,800"], "ans": 2, "exp": "Natural increase 3,800. Net increase 1,300. Net migration = 1,300 - 3,800 = -2,500."}, {"id": 74, "section": "Population Census", "q": "Jamaica****'****s 2024 population growth statistics (STATIN): 25,900 births, 20,600 deaths, net external movements of -8,800. Natural increase and net increase are:", "opts": ["+5,300 and +5,300", "+5,300 and -3,500", "-3,500 and +5,300", "+8,800 and -5,300"], "ans": 1, "exp": "Natural increase = 25,900 - 20,600 = 5,300. Net increase = 5,300 - 8,800 = -3,500, so the population fell."}, {"id": 75, "section": "Population Census", "q": "With 25,900 births and a mean population of 2,702,200, Jamaica****'****s 2024 CBR was about:", "opts": ["9.6 per 1,000", "15.1 per 1,000", "12.5 per 1,000", "25.9 per 1,000"], "ans": 0, "exp": "25,900 / 2,702,200 x 1,000 = 9.58."}, {"id": 76, "section": "Population Census", "q": "Net external movement in Jamaica****'****s population statistics is described as:", "opts": ["The number of work permits issued", "A count of all visitors arriving", "The number of births abroad", "A proxy measure of emigration based on movements of Jamaican nationals to and from the island"], "ans": 3, "exp": "From 2020 the estimates used permanent visas issued to Jamaican nationals."}, {"id": 77, "section": "Population Census", "q": "According to the UN Migration Data Portal slide, the total number of international migrants at mid-year 2020 was:", "opts": ["28.1 million", "2.8 billion", "3.5 million", "280.6 million"], "ans": 3, "exp": "Source: UN DESA 2020."}, {"id": 78, "section": "Population Census", "q": "In the 2009 pie chart of Caribbean-born people in the USA (total 3,465,890), the largest group was:", "opts": ["Dominican Republic, 28.6%", "Jamaica, 28.6%", "Cuba, 28.6%", "Haiti, 28.6%"], "ans": 2, "exp": "Dominican Republic 22.9%, Jamaica 18.8%, Haiti 15.5%, T&T 6.4%, Barbados 1.4%."}, {"id": 79, "section": "Age and Sex Composition", "q": "In demography, age is measured as:", "opts": ["Age at next birthday", "Completed age, the age at last birthday", "Age at nearest birthday", "Year of birth only"], "ans": 1, "exp": "Age is collected in single years but usually published in non-overlapping 5-year groups."}, {"id": 80, "section": "Age and Sex Composition", "q": "Gender is defined in the lecture as:", "opts": ["The social roles and norms associated with being male or female", "Male and female in terms of biological functions", "The sex ratio of a population", "Sex recorded at birth registration"], "ans": 0, "exp": "Sex is biological. Gender is social."}, {"id": 81, "section": "Age and Sex Composition", "q": "A pyramid with a very broad base, reflecting high fertility and high mortality, is called:", "opts": ["Expansive", "Constrictive", "Stationary", "Rectangular"], "ans": 0, "exp": "Constrictive: low fertility and mortality with a working-age bulge. Stationary: very low births and deaths."}, {"id": 82, "section": "Age and Sex Composition", "q": "A pyramid associated with negative growth and very low birth and death rates is:", "opts": ["Expansive", "Youth-bulge", "Transitional", "Stationary"], "ans": 3, "exp": "The lecture lists three shapes: expansive, constrictive and stationary."}, {"id": 83, "section": "Age and Sex Composition", "q": "By the lecture****'****s classification, a population is OLD if the proportion aged 65 and over is:", "opts": ["About 6%", "Under 5%", "10% or more", "35% or more"], "ans": 2, "exp": "Under 5% is young. For under-15s, below 25% is old and 35% or more is young."}, {"id": 84, "section": "Age and Sex Composition", "q": "A population with a median age of 27.7 (Jamaica 2011) is classified as:", "opts": ["Old", "Intermediate-aged", "Young", "Very youthful"], "ans": 1, "exp": "Under 20 is young, 20 to 29 intermediate, 30 or more old."}, {"id": 85, "section": "Age and Sex Composition", "q": "Use Md = L + [(N/2 - cum f before) / f] x i. For 1991: N/2 = 1,190,334, cumulative frequency before the median class (20-24) = 1,087,831, f = 233,333, i = 5. The median age is about:", "opts": ["23.0 years", "22.2 years", "21.4 years", "20.9 years"], "ans": 1, "exp": "20 + (102,503 / 233,333) x 5 = 22.20."}, {"id": 86, "section": "Age and Sex Composition", "q": "For 2001: N/2 = 1,303,816, cumulative frequency before the 20-24 class = 1,095,544, f = 215,881, i = 5. The median age is about:", "opts": ["24.8 years", "22.2 years", "25.6 years", "20.9 years"], "ans": 0, "exp": "20 + (208,272 / 215,881) x 5 = 24.82. The median class is 20-24 because 1,303,816 lies between 1,095,544 and 1,311,425."}, {"id": 87, "section": "Age and Sex Composition", "q": "Barbados 1980: 73,812 persons aged 0-14 and 149,041 aged 15-64. The child dependency ratio is about:", "opts": ["20.2", "73.8", "149.0", "49.5"], "ans": 3, "exp": "73,812 / 149,041 x 100 = 49.52."}, {"id": 88, "section": "Age and Sex Composition", "q": "Jamaica 2011: 702,835 aged 0-14, 217,606 aged 65+, 1,777,542 aged 15-64. The total dependency ratio is about:", "opts": ["12.3", "39.5", "51.8", "76.4"], "ans": 2, "exp": "(702,835 + 217,606) / 1,777,542 x 100 = 51.8. Child 39.5 plus aged 12.3."}, {"id": 89, "section": "Age and Sex Composition", "q": "If the total dependency ratio is 50 per 100, the total support ratio is:", "opts": ["50 per 100", "0.5 working-age persons per dependent", "2.0 working-age persons per dependent", "5.0 working-age persons per dependent"], "ans": 2, "exp": "The support ratio is the reciprocal of the dependency ratio."}, {"id": 90, "section": "Age and Sex Composition", "q": "Adjusted dependency ratios differ from ordinary ones because they use:", "opts": ["0-17 and 70+ as dependents", "0-19 and 65+ as dependents and 20-64 as working age", "0-14 and 60+ as dependents", "15-59 as working age"], "ans": 1, "exp": "Most people find a permanent job at about age 20."}, {"id": 91, "section": "Age and Sex Composition", "q": "The aged-child index is calculated as:", "opts": ["Pop 65+ divided by pop 0-14, times 100", "Pop 0-14 divided by pop 65+, times 100", "Pop 65+ divided by pop 15-64, times 100", "Pop 60+ divided by total pop, times 100"], "ans": 0, "exp": "For Jamaica 2011: 217,606 / 702,835 x 100 = 31.0. Values under 15 indicate a young population."}, {"id": 92, "section": "Age and Sex Composition", "q": "Barbados 1960 had 105,519 males and 126,811 females. The sex ratio was:", "opts": ["120.2 males per 100 females", "45.4", "54.6", "83.2 males per 100 females"], "ans": 3, "exp": "105,519 / 126,811 x 100 = 83.2. Under 100 means excess females."}, {"id": 93, "section": "Age and Sex Composition", "q": "National sex ratios are normally in the range of:", "opts": ["80 to 90", "105 to 120", "110 to 125", "95 to 102"], "ans": 3, "exp": "Outside 90 to 105 is considered extreme."}, {"id": 94, "section": "Age and Sex Composition", "q": "Sex ratio at birth in human populations is generally:", "opts": ["110 to 120", "95 to 98", "104 to 107, with the West Indies about 103", "About 100 everywhere"], "ans": 2, "exp": "More boys are born than girls. China reached 117 in 2000 because of son preference."}, {"id": 95, "section": "Age and Sex Composition", "q": "The sex ratio falls as age increases mainly because:", "opts": ["Women migrate less", "Male mortality is higher and women live 3 to 5 years longer on average", "More girls are born", "Men are not counted in older ages"], "ans": 1, "exp": "The ratio is almost even in early adult years and lowest in old age."}, {"id": 96, "section": "Age and Sex Composition", "q": "Which is a manifestation of son preference?", "opts": ["Boys being better fed and given earlier medical attention", "Higher female enrolment in school", "Higher female life expectancy", "Equal inheritance of land"], "ans": 0, "exp": "Others: female infanticide and neglect. Where fertility is high, couples continue having children to get a son."}, {"id": 97, "section": "Age and Sex Composition", "q": "According to Leahy et al. (2007), countries with a large youth-bulge proportion experience:", "opts": ["A high risk of political violence and civil strife", "Stable democracies", "Faster ageing", "Lower child dependency"], "ans": 0, "exp": "Very youthful populations (median under 20) show high instability and rare democracy."}, {"id": 98, "section": "Age and Sex Composition", "q": "Which age range does the lecture give for ****'****youth****'****?", "opts": ["10-19", "10-24", "0-14", "15-24"], "ans": 3, "exp": "10-19 are adolescents and 10-24 are young people. Working age is 15-64 (ILO)."}, {"id": 99, "section": "Age and Sex Composition", "q": "Erik Erikson is associated with the theory of:", "opts": ["Life chances", "Cognitive development", "Psychosocial development, with a crisis at each life stage", "The demographic transition"], "ans": 2, "exp": "Piaget is cognitive development. Glen Elder is life course theory."}, {"id": 100, "section": "Age and Sex Composition", "q": "The demographic dividend begins when the dependency ratio falls to about:", "opts": ["50 per 100 for any definition", "67 per 100 using 15-59 as working age, or 75 per 100 using 20-64", "30 per 100", "100 per 100"], "ans": 1, "exp": "The dividend ends when the dependency line goes back up."}, {"id": 101, "section": "Age and Sex Composition", "q": "In 2026 the percentage of the population under 15 is highest in:", "opts": ["North America, about 18%", "Africa, about 40%", "Asia, about 23%", "Europe, about 16%"], "ans": 1, "exp": "Africa is also lowest for 65+ at about 3%. Europe is about 19% aged 65+."}, {"id": 102, "section": "Age and Sex Composition", "q": "According to the WHO figures in the lecture, the world****'****s elderly (60+) population of 650 million is forecast to reach:", "opts": ["2 billion by 2050", "1 billion by 2030", "5 billion by 2100", "650 million by 2050"], "ans": 0, "exp": "Population ageing began in developed countries from the 1950s and now affects developing countries."}, {"id": 103, "section": "Age and Sex Composition", "q": "Among the 2012 figures shown, which country had the highest percentage aged 65+?", "opts": ["Italy, 21%", "Spain, 17%", "Greece, 19%", "Japan, 24%"], "ans": 3, "exp": "Japan also had the highest life expectancy listed at 83, women 86."}, {"id": 104, "section": "Age and Sex Composition", "q": "Jamaica****'****s 2011 census showed the share of the population aged 15-64 at about:", "opts": ["8.1%", "60.0%, down from 65.9%", "65.9%, up from 60.0% in 2001", "26%"], "ans": 2, "exp": "The share aged 0-4 fell from 10.46% to 7.78%, and 65+ rose from 7.65% to 8.07%."}, {"id": 105, "section": "Age and Sex Composition", "q": "Saint Vincent and the Grenadines had 55,551 males and 53,637 females in 2010. The sex ratio was about:", "opts": ["109.3", "96.6", "103.6 males per 100 females", "50.9"], "ans": 2, "exp": "55,551 / 53,637 x 100 = 103.6."}, {"id": 106, "section": "Age and Sex Composition", "q": "Which Arab Spring country had the lowest median age (about 18.1) in the lecture table?", "opts": ["Bahrain", "Yemen", "Tunisia", "Egypt"], "ans": 1, "exp": "Tunisia was about 30.0, Egypt 24.3 and Bahrain 30.9. The table supports the youth-bulge argument."}, {"id": 107, "section": "Age and Sex Composition", "q": "A masculinity proportion above 50 indicates:", "opts": ["An excess of males", "An excess of females", "A sex ratio below 100", "Equal numbers of males and females"], "ans": 0, "exp": "Masculinity proportion = males / total x 100. It usually falls just under 50."}, {"id": 108, "section": "Age and Sex Composition", "q": "A sex ratio of deaths above 120 is classed as:", "opts": ["Low", "Normal", "Intermediate", "High (male mortality much higher)"], "ans": 3, "exp": "Intermediate is 105 to 120 and low is under 105."}, {"id": 109, "section": "Age and Sex Composition", "q": "The parental support ratio is calculated as:", "opts": ["Pop 65+ divided by pop 15-64", "Pop 60+ divided by total population", "Pop 0-14 divided by pop 15-64", "Pop 80+ divided by pop 50-64, times 100"], "ans": 3, "exp": "It shows how many adult children are available to care for very old parents without caring for their own children at once."}, {"id": 110, "section": "Age and Sex Composition", "q": "Which statement about Jamaica****'****s median age is correct?", "opts": ["It was 30.0 in 2001", "It fell from 27.7 in 1970 to 16.8 in 2011", "It rose from 16.8 in 1970 to 27.7 in 2011, and women had a higher median than men", "Men had a higher median than women in 2011"], "ans": 2, "exp": "2011: total 27.7, male 27.0, female 28.3. 2001: 24.3. 1991: 21.7."}, {"id": 111, "section": "Age and Sex Composition", "q": "In Erikson****'****s stages, the crisis of adolescence (12 to 18 years) is:", "opts": ["Trust versus mistrust", "Identity versus role confusion", "Intimacy versus isolation", "Industry versus inferiority"], "ans": 1, "exp": "Infants: trust vs mistrust. Toddlers: autonomy vs shame and doubt. Preschool: initiative vs guilt. Childhood: industry vs inferiority. Young adults: intimacy vs isolation. Middle adulthood: generativity vs stagnation. Seniors: ego integrity vs despair."}, {"id": 112, "section": "Age and Sex Composition", "q": "In Erikson****'****s table, the crisis for ages 40 to 65 is:", "opts": ["Generativity versus stagnation", "Identity versus role confusion", "Ego integrity versus despair", "Initiative versus guilt"], "ans": 0, "exp": "The virtue for this stage is care. Seniors (65+) have the virtue of wisdom."}, {"id": 113, "section": "Age and Sex Composition", "q": "Which generation is given the birth years 1946 to 1964 in the lecture tables?", "opts": ["Baby Boomers", "Silent Generation", "Generation X", "Millennials"], "ans": 0, "exp": "The Silent Generation is 1925-1945. Boomers followed the post-war surge in births."}, {"id": 114, "section": "Age and Sex Composition", "q": "In the ****'****Three Patterns of Population Change****'**** graphic, which country represents RAPID growth?", "opts": ["Germany", "United States", "Japan", "Kenya"], "ans": 3, "exp": "The US shows slow growth and Germany negative growth."}, {"id": 115, "section": "Age and Sex Composition", "q": "On an annotated population pyramid, indents (narrowing) in the shape indicate:", "opts": ["A baby boom", "A high birth rate", "Higher death rates than normal, for example from war, famine, disease or emigration", "Immigration of children"], "ans": 2, "exp": "Bulges show immigration or a baby boom. A wide base means a high birth rate and a narrow base a low birth rate."}, {"id": 116, "section": "Age and Sex Composition", "q": "Comparing Jamaica****'****s 2001 and 2011 pyramids, the base of the 2011 pyramid is:", "opts": ["Wider, showing rising fertility", "Narrower, showing falling fertility", "Unchanged", "Absent"], "ans": 1, "exp": "The share aged 0-4 fell from 10.46% to 7.78%."}, {"id": 117, "section": "Age and Sex Composition", "q": "In the types of age profile (Figure 3.6), an ****'****undercut****'**** profile shows:", "opts": ["A rectangular shape with high mortality", "An appreciable deficit in the child age groups from a recent decline in births", "Dual peaks from suburbs", "A peak at one age group from in-migration"], "ans": 1, "exp": "Rectangular is 'old'. Unimodal has one pronounced peak. Bimodal has dual peaks."}, {"id": 118, "section": "Age and Sex Composition", "q": "Population pyramids for the EU (2019 and 2100 projection) show that by 2100:", "opts": ["The oldest age group (85+) becomes much larger", "Males greatly outnumber females", "The base becomes much wider", "The working-age groups disappear"], "ans": 0, "exp": "The EU is projected to age further."}, {"id": 119, "section": "Age and Sex Composition", "q": "In the 2025 data on the percentage of the population aged 60+, which Caribbean country had the highest share among those listed?", "opts": ["Haiti, 7.5%", "St Lucia, 12.1%", "Jamaica, 14.5%", "Barbados, 25.2%"], "ans": 3, "exp": "Cuba was 25.1%, Martinique 23.9%, and the more developed regions 28.2%. Haiti was lowest at 7.5%."}, {"id": 120, "section": "Age and Sex Composition", "q": "The percentage aged 60+ for the Caribbean as a whole moved from 8.1% (1975) to what in 2025?", "opts": ["28.2%", "8.1%", "16.1%", "9.9%"], "ans": 2, "exp": "2000 was 9.9%. The more developed regions were 15.4%, 19.4% and 28.2%."}, {"id": 121, "section": "Age and Sex Composition", "q": "Jamaica 2011 census: males 1,334,533, females 1,363,450. The sex ratio was about:", "opts": ["28.9", "49.5", "97.9 males per 100 females", "102.2"], "ans": 2, "exp": "1,334,533 / 1,363,450 x 100 = 97.88. In 2001 it was 96.94. Females exceeded males by 28,917."}, {"id": 122, "section": "Age and Sex Composition", "q": "In the 2011 parish analysis, which parish had the lowest sex ratio (most females per male)?", "opts": ["St Thomas, 100.03", "St Andrew, 91.73", "Hanover, 101.72", "Westmoreland, 104.63"], "ans": 1, "exp": "St Catherine was 94.17 and St James 96.88. Westmoreland was highest at 104.63."}, {"id": 123, "section": "Age and Sex Composition", "q": "Life expectancy in Jamaica in 2006-2008 was 71.26 years for men and 74.13 for women. The female advantage was about:", "opts": ["2.9 years", "5.6 years", "12 years", "0.3 years"], "ans": 0, "exp": "In 1910-1912 the figures were 55.73 and 58.89, a 3.2-year gap."}, {"id": 124, "section": "Age and Sex Composition", "q": "Using Jamaica****'****s population in 1950 (0-14: 505,500; 15-64: 843,299; 65+: 54,099), the child dependency ratio was about:", "opts": ["66.4", "15.6", "6.4", "59.9"], "ans": 3, "exp": "505,500 / 843,299 x 100 = 59.94. The total ratio was 66.4 and the aged ratio 6.4."}, {"id": 125, "section": "Age and Sex Composition", "q": "Using the same data for 2010 (0-14: 764,677; 15-64: 1,848,791; 65+: 207,093), the total dependency ratio was about:", "opts": ["74.0", "11.2", "41.4", "52.6"], "ans": 3, "exp": "(764,677 + 207,093) / 1,848,791 x 100 = 52.56. Child 41.4 and aged 11.2."}, {"id": 126, "section": "Age and Sex Composition", "q": "The elderly support ratio for Jamaica in 2010 (15-64: 1,848,791; 65+: 207,093) was about:", "opts": ["41.4", "15.6", "8.9 working-age persons per elderly person", "0.11"], "ans": 2, "exp": "1,848,791 / 207,093 = 8.93. In 1950 it was 15.6, so support per elderly person fell."}, {"id": 127, "section": "Age and Sex Composition", "q": "In Jamaica in 2011, which parish had the highest percentage of its population aged 65 and over?", "opts": ["Hanover, about 7.3%", "St Elizabeth, about 10.1%", "St Catherine, about 7.0%", "Kingston, about 6.1%"], "ans": 1, "exp": "15,171 / 150,205 = 10.1%. Manchester was 9.7%."}, {"id": 128, "section": "Basics & Components of Population Change", "q": "Who coined the word ****'****demography****'**** in 1855?", "opts": ["Achille Guillard", "John Weeks", "Max Weber", "Amartya Sen"], "ans": 0, "exp": "Weber introduced life chances and Sen the capability approach."}, {"id": 129, "section": "Basics & Components of Population Change", "q": "Max Weber****'****s concept of ****'****life chances****'**** refers to:", "opts": ["The probabilities that an individual has access to desirable resources and opportunities", "A person's fertility choices", "The probability of surviving to age 65", "The number of years a person is expected to work"], "ans": 0, "exp": "Structural factors such as class, status and power shape life chances beyond personal effort."}, {"id": 130, "section": "Basics & Components of Population Change", "q": "'****87 males per 100 females****'**** is an example of a:", "opts": ["Proportion", "Rate", "Count", "Ratio"], "ans": 3, "exp": "A proportion relates a subgroup to the whole (for example 53.9% urban). A rate measures frequency over time."}, {"id": 131, "section": "Basics & Components of Population Change", "q": "Which of the following is a period (synthetic) measure?", "opts": ["The fertility of women born in 1975", "The reproductive history of the 1975 birth cohort", "Crude birth rate", "Completed family size of a cohort"], "ans": 2, "exp": "A cohort measure follows a group. A period measure is a snapshot of the whole population."}, {"id": 132, "section": "Basics & Components of Population Change", "q": "Jamaica 2019: 34,500 live births and a mid-year population of 2,726,300. The CBR is about:", "opts": ["1.27 per 1,000", "12.65 per 1,000", "126.5 per 1,000", "34.5 per 1,000"], "ans": 1, "exp": "34,500 / 2,726,300 x 1,000 = 12.65."}, {"id": 133, "section": "Basics & Components of Population Change", "q": "The CBR is described as ****'****crude****'**** because:", "opts": ["It is based on estimates, not counts", "The denominator is the whole population, not only those at risk of giving birth", "It ignores births to unmarried women", "It is calculated only once a decade"], "ans": 1, "exp": "Men, children under 14 and women over 49 are not at risk of having a birth."}, {"id": 134, "section": "Basics & Components of Population Change", "q": "Population A: 250 births, mean population 25,000. Population B: 50,000 births, mean population 5,000,000. We can conclude:", "opts": ["They have the same CBR of 10 but different population sizes", "A has a higher CBR", "B has a higher CBR", "A is the larger population"], "ans": 0, "exp": "CBR is not sensitive to population size, so it cannot tell us absolute numbers of births."}, {"id": 135, "section": "Basics & Components of Population Change", "q": "In the lecture****'****s 2017 list of high crude birth rates, which country had the highest, at 48 per 1,000?", "opts": ["Angola", "Afghanistan", "Somalia", "Niger"], "ans": 3, "exp": "The list gave Niger 48, Angola 45, Somalia 44 and Afghanistan 35. A high CBR is 35 or more."}, {"id": 136, "section": "Basics & Components of Population Change", "q": "The general fertility rate relates births to:", "opts": ["The mid-year population", "Married women only", "Women aged 15 to 49", "Women aged 20 to 39"], "ans": 2, "exp": "GFR = births / women 15-49 x 1,000. It is better than CBR but ignores differences within the 15-49 group."}, {"id": 137, "section": "Basics & Components of Population Change", "q": "Why does a country with an older population tend to have a higher crude death rate?", "opts": ["Younger people die at higher rates", "Deaths are registered more completely", "The CDR does not account for age structure, and mortality is highest at old ages", "Older people migrate less"], "ans": 2, "exp": "The CDR is affected by age composition."}, {"id": 138, "section": "Basics & Components of Population Change", "q": "If a country has a CBR of 14.2 and a CDR of 6.4 per 1,000, its crude rate of natural increase is:", "opts": ["0.78 per 1,000", "7.8 per 1,000 (0.78%)", "-7.8 per 1,000", "20.6 per 1,000"], "ans": 1, "exp": "RNI = CBR - CDR = 7.8 per 1,000, which is 0.78% a year."}, {"id": 139, "section": "Basics & Components of Population Change", "q": "A country has 5,000 immigrants and 20,000 emigrants with a mid-year population of 2,000,000. The crude net migration rate is:", "opts": ["-7.5 per 1,000", "-15 per 1,000", "-0.75 per 1,000", "+7.5 per 1,000"], "ans": 0, "exp": "(5,000 - 20,000) / 2,000,000 x 1,000 = -7.5."}, {"id": 140, "section": "Basics & Components of Population Change", "q": "Jamaica 1997 had net migration of -18,300 and natural increase of 44,000. The migration ratio is:", "opts": ["-2.4", "-18.3", "+41.6", "-41.6, so 41.6% of natural increase was taken away by migration"], "ans": 3, "exp": "-18,300 / 44,000 x 100 = -41.6. In a closed population the ratio is 0."}, {"id": 141, "section": "Basics & Components of Population Change", "q": "Suriname: population at end of 1972 was 383,700, with 87,100 births and 20,600 deaths in 1973-1980. If the 1980 population was 350,700, net migration was:", "opts": ["-66,500", "+99,500", "-32,900", "-99,500"], "ans": 3, "exp": "Expected = 383,700 + 87,100 - 20,600 = 450,200. Net migration = 350,700 - 450,200 = -99,500. Natural increase = +66,500."}, {"id": 142, "section": "Basics & Components of Population Change", "q": "Which region had a NEGATIVE natural increase in the 2026 crude rates table?", "opts": ["Oceania (+9.6)", "Asia (+8.0)", "Europe (-3.6)", "Africa (+23.3)"], "ans": 2, "exp": "Europe: CBR 8.2, CDR 11.8. Also negative in the country table: Ukraine -9.1, Germany -3.9, Japan -6.6."}, {"id": 143, "section": "Basics & Components of Population Change", "q": "Which is NOT one of the five aspects of human population that demography focuses on?", "opts": ["Determinants and consequences of population change", "Political ideology", "Size", "Composition or structure"], "ans": 1, "exp": "The five are size, distribution, composition, population dynamics and determinants and consequences."}, {"id": 144, "section": "Basics & Components of Population Change", "q": "Population studies differs from formal demography because it:", "opts": ["Also examines relationships between population change and social, economic, political, biological and geographical factors", "Uses only mathematical analysis", "Excludes health and education", "Studies only size and distribution"], "ans": 0, "exp": "Formal demography is the narrow, mathematical study of size, distribution, structure and change."}, {"id": 145, "section": "Basics & Components of Population Change", "q": "The only tertiary institution in the Caribbean offering BSc and MSc degrees in Demography is:", "opts": ["UWI, Mona", "UWI, Cave Hill", "University of Technology, Jamaica", "University of Guyana"], "ans": 0, "exp": "Other institutions offer demography courses but not these degrees."}, {"id": 146, "section": "Basics & Components of Population Change", "q": "In Amartya Sen****'****s capability approach, ****'****capabilities****'**** are:", "opts": ["The things a person actually does or is", "A person's age and sex", "A person's income and goods", "The possibilities or opportunities to achieve functionings"], "ans": 3, "exp": "Two people may both fast, but one chooses to and the other is starving, so their capabilities differ."}, {"id": 147, "section": "Basics & Components of Population Change", "q": "In demography the constant ****'****K****'**** is:", "opts": ["The cohort size", "The total fertility rate", "An arbitrary number such as 1,000 or 100,000 used to make rates easier to understand", "The mid-year population"], "ans": 2, "exp": "Examples: CBR per 1,000, MMR per 100,000, sex ratio per 100 females."}, {"id": 148, "section": "Basics & Components of Population Change", "q": "The proportion of Jamaicans living in urban areas in 2011 was:", "opts": ["67.5%", "53.9%", "49.0%", "35.0%"], "ans": 1, "exp": "It was 49% in 1991."}, {"id": 149, "section": "Basics & Components of Population Change", "q": "Which Caribbean country had the highest 2026 crude birth rate in the lecture table?", "opts": ["Jamaica, 11.05", "Haiti, 21.33", "Guyana, 19.17", "Belize, 17.43"], "ans": 1, "exp": "The lowest listed was Puerto Rico at 5.93."}, {"id": 150, "section": "Basics & Components of Population Change", "q": "Which is an advantage of the CBR?", "opts": ["It is simple to compute and allows international and over-time comparison", "It accounts for age structure", "It is unaffected by under-reporting", "It is based only on women at risk"], "ans": 0, "exp": "It needs only total births and the mid-year population."}, {"id": 151, "section": "Basics & Components of Population Change", "q": "A limitation of the general fertility rate is that it:", "opts": ["Uses the whole population as the denominator", "Includes men in the denominator", "Cannot be calculated annually", "Does not account for differences in fertility patterns across reproductive ages"], "ans": 3, "exp": "It also includes women who are infertile or not at risk."}, {"id": 152, "section": "Basics & Components of Population Change", "q": "Which event can distort the crude rate of natural increase?", "opts": ["A change in enumeration method", "A change in census date", "An abnormal change in age structure such as war", "A change in map scale"], "ans": 2, "exp": "A population with many young people has a high rate of natural increase."}, {"id": 153, "section": "Basics & Components of Population Change", "q": "The total migration rate is:", "opts": ["Emigrants / immigrants x 100", "(Immigrants - emigrants) / mid-year population x 1,000", "(Immigrants + emigrants) / mid-year population x 1,000", "Net migration / natural increase x 100"], "ans": 2, "exp": "It shows the total volume of people involved in migration."}, {"id": 154, "section": "Basics & Components of Population Change", "q": "Which country supplies the largest share of Caribbean immigrants in the USA (2024 slide)?", "opts": ["Dominican Republic, 24.7%", "Cuba, 32.1%", "Jamaica, 16.9%", "Haiti, 16.3%"], "ans": 1, "exp": "The total is 5,254,000. The Dominican Republic is second at 24.7%."}, {"id": 155, "section": "Basics & Components of Population Change", "q": "Which region had the highest crude birth rate in the 2026 regional table?", "opts": ["Africa, 30.6 per 1,000", "Asia, 15.0", "World, 16.0", "Oceania, 16.2"], "ans": 0, "exp": "Europe had the lowest at 8.2."}, {"id": 156, "section": "Basics & Components of Population Change", "q": "Jamaica****'****s crude birth rate was 12.5 in 2018. By 2022 it was:", "opts": ["17.0 per 1,000", "9.1 per 1,000", "14.2 per 1,000", "11.4 per 1,000"], "ans": 3, "exp": "It was 17.0 in 2008. Jamaica's TFR fell from 2.4 (2008) to 1.9 (2022)."}, {"id": 157, "section": "Basics & Components of Population Change", "q": "In the multi-state (population flow) diagram, the net migration rate is:", "opts": ["(B - D) / P x 1,000", "I / O x 100", "(I + O) / P x 1,000", "(I - O) / P x 1,000"], "ans": 3, "exp": "The gross migration rate is (I + O) / P x 1,000. Inward is I / P and outward is O / P."}, {"id": 158, "section": "Basics & Components of Population Change", "q": "In the multi-state diagram, the arrow from ****'****unborn****'**** to ****'****alive and in the population****'**** represents:", "opts": ["Immigration", "Emigration", "Births, measured by the CBR (B / P x 1,000)", "Deaths, measured by the CDR"], "ans": 2, "exp": "The arrow to 'dead' is mortality (CDR = D / P x 1,000)."}, {"id": 159, "section": "Basics & Components of Population Change", "q": "The PRB 2022 World Population Data Sheet shows Europe with births per 1,000 of 9, deaths 13 and a natural increase of:", "opts": ["-1.3%", "-0.3% (a natural decrease)", "+0.9%", "+0.3%"], "ans": 1, "exp": "Europe's TFR was 1.5. Latvia's natural increase was -0.9%.\n\nSOCI2004 MCQ Bank   |   Page"}];
const SECS=[...new Set(Q.map(q=>q.section))];
const $=id=>document.getElementById(id);
let selSecs=new Set(SECS),order='seq',count='all',list=[],i=0,right=0,missed=[],answered=false;
function load(){try{return JSON.parse(localStorage.getItem('soci2004_missed')||'[]')}catch(e){return[]}}
function save(a){try{localStorage.setItem('soci2004_missed',JSON.stringify(a))}catch(e){}}
function chips(el,items,isOn,onClick){el.innerHTML='';items.forEach(([k,label])=>{const b=document.createElement('button');b.className='chip'+(isOn(k)?' on':'');b.textContent=label;b.onclick=()=>{onClick(k);render()};el.appendChild(b)})}
function pool(){return Q.filter(q=>selSecs.has(q.section))}
function render(){
  chips($('secs'),SECS.map(s=>[s,s+' ('+Q.filter(q=>q.section===s).length+')']),k=>selSecs.has(k),k=>{selSecs.has(k)?selSecs.delete(k):selSecs.add(k)});
  chips($('order'),[['seq','In order'],['rand','Random']],k=>order===k,k=>order=k);
  chips($('count'),[['10','10'],['20','20'],['all','All']],k=>count===k,k=>count=k);
  const n=pool().length;$('avail').textContent=n+' questions in selection';$('start').disabled=n===0;
  const m=load();$('startMissed').disabled=m.length===0;$('savedinfo').textContent=m.length?m.length+' missed question(s) saved on this device.':'Questions you get wrong are saved here for later review.';
}
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function begin(qs){list=qs;i=0;right=0;missed=[];$('setup').classList.add('hide');$('done').classList.add('hide');$('quiz').classList.remove('hide');show()}
$('start').onclick=()=>{let p=pool();if(order==='rand')p=shuffle(p);if(count!=='all')p=p.slice(0,+count);begin(p)};
$('startMissed').onclick=()=>{const ids=new Set(load());begin(shuffle(Q.filter(q=>ids.has(q.id))))};
function show(){
  const q=list[i];answered=false;
  $('prog').textContent='Question '+(i+1)+' of '+list.length;$('score').textContent='Score: '+right+'/'+i;
  $('barfill').style.width=(i/list.length*100)+'%';
  $('qtag').textContent='Q'+q.id+' · '+q.section;$('qtext').textContent=q.q;$('exp').innerHTML='';
  const o=$('opts');o.innerHTML='';
  q.opts.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';
    const l=document.createElement('span');l.className='l';l.textContent='ABCD'[k];
    const s=document.createElement('span');s.textContent=t;b.append(l,s);b.onclick=()=>pick(k);o.appendChild(b)});
  $('next').disabled=true;$('next').textContent=i===list.length-1?'Finish':'Next';
}
function pick(k){
  if(answered)return;answered=true;const q=list[i];const ok=k===q.ans;
  [...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  const saved=load();
  if(ok){right++;save(saved.filter(x=>x!==q.id))}else{missed.push(q);if(!saved.includes(q.id)){saved.push(q.id);save(saved)}}
  const e=document.createElement('div');e.className='exp '+(ok?'ok':'bad');
  const v=document.createElement('b');v.className='v';v.textContent=ok?'Correct':'Not quite. The answer is '+'ABCD'[q.ans]+'.';
  const p=document.createElement('div');p.textContent=q.exp;e.append(v,p);$('exp').appendChild(e);
  $('score').textContent='Score: '+right+'/'+(i+1);$('barfill').style.width=((i+1)/list.length*100)+'%';
  $('next').disabled=false;$('next').focus();
}
$('next').onclick=()=>{if(i<list.length-1){i++;show()}else finish()};
$('quit').onclick=()=>{if(i>0||answered)list=list.slice(0,answered?i+1:i);list.length?finish():home()};
function finish(){
  $('quiz').classList.add('hide');$('done').classList.remove('hide');
  const n=list.length,pct=n?Math.round(right/n*100):0;
  $('final').textContent=right+' / '+n+' ('+pct+'%)';
  $('finalsub').textContent=missed.length?'Review what you missed below.':'Perfect run. Nothing missed.';
  const m=$('missed');m.innerHTML='';
  missed.forEach(q=>{const d=document.createElement('div');d.className='miss';
    const b=document.createElement('b');b.textContent='Q'+q.id+'. '+q.q;
    const a=document.createElement('div');a.textContent='Answer '+'ABCD'[q.ans]+': '+q.opts[q.ans];
    const x=document.createElement('div');x.className='small';x.textContent=q.exp;d.append(b,a,x);m.appendChild(d)});
  $('retry').disabled=missed.length===0;
}
function home(){$('quiz').classList.add('hide');$('done').classList.add('hide');$('setup').classList.remove('hide');render()}
$('again').onclick=home;
$('retry').onclick=()=>begin(shuffle(missed));
render();
</script></body></html>
